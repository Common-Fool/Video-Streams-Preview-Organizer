name: Build exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # для выкладки exe в релиз по тегу v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # pythonnet (нужен pywebview) отстаёт с поддержкой самых новых версий

      - name: Install PyInstaller and pywebview
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Check syntax
        run: python -m py_compile pairview.py

      - name: Build VSPO.exe
        run: >
          pyinstaller --onefile --noconsole --name VSPO --icon assets/vspo.ico
          --collect-all webview --collect-all pythonnet --collect-all clr_loader pairview.py

      - uses: actions/upload-artifact@v4
        with:
          name: VSPO
          path: dist/VSPO.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VSPO.exe
